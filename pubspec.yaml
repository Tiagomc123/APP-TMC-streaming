name: mc
description: "TMC - agregador de streaming (Android / Android TV)."
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ------------------------------- rede / extracao --------------------------
  http: ^1.6.0

  # ------------------------------- player nativo ----------------------------
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_android_video: ^1.3.6

  # ------------------------------- trailer embutido -------------------------
  youtube_player_iframe: 6.0.2

  # ------------------------------- infra ------------------------------------
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  device_info_plus: ^11.0.0
  wakelock_plus: ^1.2.0
  cached_network_image: ^3.4.0
  google_fonts: ^9.0.0

  # ------------------------------- usado apenas por lib/legacy ---------------
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  video_player: ^2.14.1
  url_launcher: ^6.3.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
